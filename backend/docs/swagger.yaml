basePath: /api
definitions:
  dto.LoginUser:
    properties:
      email:
        description: |-
          required: true
          example: user@example.com
        type: string
      login:
        description: |-
          required: true
          example: username123
        type: string
      password:
        description: |-
          required: true
          example: securePassword123
        type: string
    type: object
  dto.RegisterUser:
    properties:
      email:
        description: |-
          required: true
          example: user@example.com
        type: string
      login:
        description: |-
          required: true
          example: username123
        type: string
      password:
        description: |-
          required: true
          example: securePassword123
        type: string
    type: object
  dto.VerificationRequest:
    properties:
      email:
        description: |-
          required: true
          example: user@example.com
        type: string
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        description: |-
          required: true
          example: 123456
        type: string
      email:
        description: |-
          required: true
          example: user@example.com
        type: string
    type: object
  entities.Booking:
    properties:
      computer_id:
        type: integer
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: integer
      package_id:
        type: integer
      room:
        type: string
      start_time:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  entities.Computer:
    properties:
      cpu:
        type: string
      created_at:
        type: string
      gpu:
        type: string
      hdd:
        type: string
      headset:
        type: string
      id:
        type: integer
      keyboard:
        type: string
      monitor:
        type: string
      mouse:
        type: string
      mousepad:
        type: string
      ram:
        type: string
      ssd:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  entities.ComputerOccupiedLeftTime:
    properties:
      id:
        type: integer
      left_time:
        type: integer
    type: object
  entities.ComputerStatus:
    properties:
      id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  entities.Package:
    properties:
      created_at:
        type: string
      end_time:
        type: string
      name:
        type: string
      price:
        type: integer
      room:
        type: string
      start_time:
        type: string
    type: object
  handlers.JSONAnswer:
    properties:
      id:
        type: integer
      message:
        type: string
    type: object
  utils.HTTPError:
    properties:
      error:
        type: string
    type: object
  utils.Message:
    properties:
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Esports Club Reservation system
  title: Esports Club Booking API
  version: "1.0"
paths:
  /api/bookings:
    get:
      consumes:
      - application/json
      description: Returns a list of bookings with various statuses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get all bookings with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Creates a new booking with the given details
      parameters:
      - description: Booking details
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/entities.Booking'
      produces:
      - application/json
      responses:
        "201":
          description: Booking created successfully
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      security:
      - BearerAuth: []
      summary: Create a new booking
      tags:
      - Bookings
  /api/bookings/{id}/left:
    get:
      consumes:
      - application/json
      description: Returns the left time for the specified computer ID
      parameters:
      - description: Computer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Left time for the computer
          schema:
            $ref: '#/definitions/entities.ComputerOccupiedLeftTime'
        "400":
          description: Invalid computer ID
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get the left time for a specific computer in seconds
      tags:
      - Bookings
  /api/bookings/active:
    get:
      consumes:
      - application/json
      description: Returns a list of active bookings
      produces:
      - application/json
      responses:
        "200":
          description: List of active bookings
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get active bookings with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Bookings
  /api/bookings/cancelled:
    get:
      consumes:
      - application/json
      description: Returns a list of cancelled bookings
      produces:
      - application/json
      responses:
        "200":
          description: List of cancelled bookings
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get cancelled bookings with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Bookings
  /api/bookings/computers-left-time:
    get:
      consumes:
      - application/json
      description: Returns a list of computers left time
      produces:
      - application/json
      responses:
        "200":
          description: List of computers left time
          schema:
            items:
              $ref: '#/definitions/entities.ComputerOccupiedLeftTime'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get computers left time in seconds
      tags:
      - Bookings
  /api/bookings/finished:
    get:
      consumes:
      - application/json
      description: Returns a list of finished bookings
      produces:
      - application/json
      responses:
        "200":
          description: List of finished bookings
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get finished bookings with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Bookings
  /api/bookings/pending:
    get:
      consumes:
      - application/json
      description: Returns a list of pending bookings
      produces:
      - application/json
      responses:
        "200":
          description: List of pending bookings
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get pending bookings with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Bookings
  /api/computers:
    get:
      description: Returns a list of all computers
      produces:
      - application/json
      responses:
        "200":
          description: List of computers
          schema:
            items:
              $ref: '#/definitions/entities.Computer'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get all computers
      tags:
      - Computers
    post:
      consumes:
      - application/json
      description: Creates a new computer
      parameters:
      - description: Computer details
        in: body
        name: computer
        required: true
        schema:
          $ref: '#/definitions/entities.Computer'
      produces:
      - application/json
      responses:
        "201":
          description: Computer created successfully
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Create a new computer
      tags:
      - Computers
  /api/computers/{id}:
    delete:
      description: Deletes a specific computer by ID
      parameters:
      - description: Computer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Computer deleted successfully
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "400":
          description: Invalid computer ID
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "404":
          description: Computer not found
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Delete a specific computer
      tags:
      - Computers
    get:
      description: Returns a specific computer by ID
      parameters:
      - description: Computer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Computer details
          schema:
            $ref: '#/definitions/entities.Computer'
        "400":
          description: Invalid computer ID
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "404":
          description: Computer not found
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get a specific computer
      tags:
      - Computers
  /api/computers/{id}/bookings:
    get:
      consumes:
      - application/json
      description: Returns a list of bookings for the specified computer ID
      parameters:
      - description: Computer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of bookings for the computer
          schema:
            items:
              $ref: '#/definitions/entities.Booking'
            type: array
        "400":
          description: Invalid computer ID
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get bookings for a specific computer with time format "2006-01-02T15:04:05Z07:00"
      tags:
      - Computers
  /api/computers/{id}/status:
    get:
      consumes:
      - application/json
      description: Returns the status of the specified computer ID
      parameters:
      - description: Computer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Computer status
          schema:
            $ref: '#/definitions/entities.ComputerStatus'
        "400":
          description: Invalid computer ID
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "404":
          description: Computer not found
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get the status of a specific computer
      tags:
      - Computers
  /api/computers/statuses:
    get:
      consumes:
      - application/json
      description: Returns a list of all computer statuses
      produces:
      - application/json
      responses:
        "200":
          description: List of computer statuses
          schema:
            items:
              $ref: '#/definitions/entities.ComputerStatus'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get all computer statuses
      tags:
      - Computers
  /api/packages:
    get:
      description: Returns a list of all packages
      produces:
      - application/json
      responses:
        "200":
          description: List of computers
          schema:
            items:
              $ref: '#/definitions/entities.Package'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
      summary: Get all packages
      tags:
      - Packages
  /auth/activate:
    post:
      consumes:
      - application/json
      description: Sends a verification code to the email provided in request body
      parameters:
      - description: Verification code request
        in: body
        name: verificationRequest
        required: true
        schema:
          $ref: '#/definitions/dto.VerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification code sent
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.HTTPError'
      summary: Send verification code to user's email
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Login user with email, login and password, returns JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUser'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            $ref: '#/definitions/utils.Message'
        "400":
          description: Bad request, validation error
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "401":
          description: Unauthorized, invalid credentials or blocked user
          schema:
            $ref: '#/definitions/utils.HTTPError'
      summary: User login
      tags:
      - Auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: Registers a user with email, login and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUser'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/utils.Message'
        "400":
          description: Bad request, validation error
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.HTTPError'
      summary: Register a new user
      tags:
      - Auth
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies user's email using a verification code
      parameters:
      - description: Email verification request
        in: body
        name: verifyEmailRequest
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/handlers.JSONAnswer'
        "400":
          description: Invalid request or verification error
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/utils.HTTPError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.HTTPError'
      summary: Verify email with code
      tags:
      - Auth
swagger: "2.0"
