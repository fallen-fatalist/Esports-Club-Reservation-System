
services:
  backend:
    build:
      context: ./backend
    image: booking-service-app
    container_name: booking-service-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=booking_service
      - DB_PORT=5432
      - JWT_SECRET=supersecretkey
      - JWT_EXPIRATION=3600
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: booking-service-db
    environment:
      - TZ=Asia/Almaty
      - PGTZ=Asia/Almaty
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=booking_service
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-booking_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./backend/postgres_init:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
    container_name: booking-service-frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0                # ✅ allow external connections
      - DANGEROUSLY_DISABLE_HOST_CHECK=true  # ✅ bypass host check for tunnels
    stdin_open: true
    tty: true
    command: npm start
    depends_on:
      - backend