services:
  backend:
    build:
      context: ./backend
    image: booking-service-app
    container_name: booking-service-backend
    ports:
      - "0.0.0.0:8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: booking-service-db
    environment:
      - TZ=Asia/Almaty
      - PGTZ=Asia/Almaty
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=booking_service
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-booking_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./backend/postgres_init:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    container_name: booking-service-minio
    ports:
      - "127.0.0.1:9000:9000"  # MinIO API
      - "127.0.0.1:9001:9001"  # MinIO Console
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

