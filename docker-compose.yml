
services:
  backend:
    build:
      context: ./backend
    image: booking-service-app
    container_name: booking-service-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=booking_service
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: booking-service-db
    environment:
      - TZ=Asia/Almaty
      - PGTZ=Asia/Almaty
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=booking_service
    ports:
      - "5432:5432"
    volumes:
      - ./backend/postgres_init:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
    container_name: booking-service-frontend
    ports:
      - "3000:3000"
    depends_on: 
      - backend  

